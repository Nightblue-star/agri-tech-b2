<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AgriTech – Alertes et risques sur vos parcelles.">
    <title>AgriTech – Alertes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <nav class="navbar">
        <div class="nav-brand">
            <button class="menu-toggle" id="openMenu">☰</button>
            <div class="logo-icon">🔔</div>
            <span class="logo-text">Agri<span>Tech</span></span>
        </div>
        <div class="nav-menu" id="mobileMenu">
            <button class="menu-close" id="closeMenu">✕</button>
            <a href="/home" class="nav-link">Tableau de bord</a>
            <a href="/parcelles" class="nav-link">Parcelles</a>
            <a href="/observations" class="nav-link">Observations</a>
            <a href="/alertes" class="nav-link active">Alertes</a>
            <a href="/meteo" class="nav-link">Météo</a>
            <a href="/carte" class="nav-link">Carte</a>
        </div>
        <div class="topbar-right">
            <div class="user-card">
                <div class="user-avatar" id="userAvatar">A</div>
                <span class="user-name" id="userName">Admin</span>
            </div>
        </div>
    </nav>

    <header class="hero"
        style="background-image: linear-gradient(rgba(15, 23, 42, 0.4), rgba(15, 23, 42, 0.4)), url('https://images.unsplash.com/photo-1560493676-04071c5f467b?q=80&w=2000&auto=format&fit=crop');">
        <p>Sécurité de vos cultures,</p>
        <h1>Alertes en Cours</h1>
    </header>

    <main class="main-content">

        <!-- Compteurs rapides -->
        <div class="stats-grid alertes-stats-grid">
            <div class="stat-card animate-fade-up delay-1">
                <div class="stat-label">Total alertes</div>
                <div class="stat-value" id="count-total">—</div>
                <div class="stat-icon-wrapper icon-purple">🔔</div>
            </div>
            <div class="stat-card animate-fade-up delay-2 border-danger-bottom">
                <div class="stat-label">Niveau Critique (3)</div>
                <div class="stat-value text-danger" id="count-3">—</div>
                <div class="stat-icon-wrapper icon-pink">🚨</div>
            </div>
            <div class="stat-card animate-fade-up delay-3">
                <div class="stat-label">Niveau Modéré (2)</div>
                <div class="stat-value stat-value-warning" id="count-2">—</div>
                <div class="stat-icon-wrapper icon-gold">⚠️</div>
            </div>
            <div class="stat-card animate-fade-up delay-4">
                <div class="stat-label">Niveau Faible (1)</div>
                <div class="stat-value stat-value-success" id="count-1">—</div>
                <div class="stat-icon-wrapper icon-blue">ℹ️</div>
            </div>
        </div>

        <!-- Filtres -->
        <div class="alertes-filters">
            <button class="filter-tab nav-link active" id="tab-all"
                onclick="setFilter('all', this)">Toutes</button>
            <button class="filter-tab stat-card" id="tab-3" onclick="setFilter(3, this)">🚨 Critiques</button>
            <button class="filter-tab stat-card" id="tab-2" onclick="setFilter(2, this)">⚠️ Modérées</button>
            <button class="filter-tab stat-card" id="tab-1" onclick="setFilter(1, this)">ℹ️ Faibles</button>
        </div>

        <!-- Liste des alertes -->
        <div id="alertesList">
            <p class="text-muted">Chargement des alertes…</p>
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>
        const NIVEAU_CONFIG = {
            3: { label:'Critique',  bg:'#fee2e2', color:'#991b1b', border:'var(--danger)', icon:'🚨' },
            2: { label:'Modérée',   bg:'#fef3c7', color:'#92400e', border:'#f59e0b',       icon:'⚠️' },
            1: { label:'Faible',    bg:'#f0fdf4', color:'#166534', border:'#22c55e',       icon:'ℹ️' },
        };

        let toutesLesAlertes = [];
        let filtreActif = 'all';

        async function loadAlertes() {
            try {
                const res = await fetch('/api/alertes');
                toutesLesAlertes = await res.json();
                updateCounters();
                renderAlertes();
            } catch(e) {
                document.getElementById('alertesList').innerHTML =
                    '<p style="color:#ef4444;">⚠️ Impossible de contacter le serveur. Lancez app.py.</p>';
            }
        }

        function updateCounters() {
            document.getElementById('count-total').textContent = toutesLesAlertes.length;
            [1,2,3].forEach(n => {
                document.getElementById('count-' + n).textContent =
                    toutesLesAlertes.filter(a => a.niveau === n).length;
            });
        }

        function setFilter(niveau, btn) {
            filtreActif = niveau;
            document.querySelectorAll('.filter-tab').forEach(t => {
                t.classList.remove('active');
            });
            btn.classList.add('active');
            renderAlertes();
        }

        function renderAlertes() {
            const liste = filtreActif === 'all'
                ? toutesLesAlertes
                : toutesLesAlertes.filter(a => a.niveau === filtreActif);

            const container = document.getElementById('alertesList');
            if (liste.length === 0) {
                container.innerHTML = '<div class="card" style="padding:30px; text-align:center; color:var(--text-muted);">✅ Aucune alerte pour ce filtre.</div>';
                return;
            }

            container.innerHTML = liste.map(a => {
                const cfg = NIVEAU_CONFIG[a.niveau] || NIVEAU_CONFIG[1];
                return `
                <div class="card alert-card" data-level="${a.niveau}" style="border-left-color:${cfg.border};"
                    onmouseover="this.style.transform='translateY(-2px)'"
                    onmouseout="this.style.transform=''">
                    <div class="alert-card-row">
                        <div>
                            <h3 class="alert-card-title">
                                ${cfg.icon} ${a.type}
                            </h3>
                            <div class="alert-card-loc">
                                📍 ${a.parcelle_nom || 'Parcelle #' + a.parcelle_id}
                            </div>
                        </div>
                        <div class="alert-card-meta">
                            <span class="alert-pill" style="background:${cfg.bg}; color:${cfg.color};">
                                ${cfg.icon} ${cfg.label}
                            </span>
                            <span class="alert-card-date">📅 ${a.date}</span>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        // Infos utilisateur
        const user = JSON.parse(localStorage.getItem('user') || 'null');
        if (user && user.nom) {
            const initials = user.nom.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
            document.getElementById('userAvatar').textContent = initials;
            document.getElementById('userName').textContent = user.nom;
        }

        loadAlertes();
    </script>
</body>

</html>
