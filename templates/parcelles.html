<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AgriTech – Gestion de vos parcelles agricoles.">
    <title>AgriTech – Parcelles</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <nav class="navbar">
        <div class="nav-brand">
            <div class="logo-icon">🚜</div>
            <span class="logo-text">Agri<span>Tech</span></span>
        </div>
        <div class="nav-menu">
            <a href="/home" class="nav-link">Tableau de bord</a>
            <a href="/parcelles" class="nav-link active">Parcelles</a>
            <a href="/observations" class="nav-link">Observations</a>
            <a href="/alertes" class="nav-link">Alertes</a>
            <a href="/meteo" class="nav-link">Météo</a>
            <a href="/carte" class="nav-link">Carte</a>
        </div>
        <div class="topbar-right">
            <div class="user-card">
                <div class="user-avatar" id="userAvatar">CL</div>
                <span style="font-size:12px; font-weight:700; color:white;" id="userName">Clyfton</span>
            </div>
        </div>
    </nav>

    <header class="hero" style="background-image: linear-gradient(rgba(15, 23, 42, 0.4), rgba(15, 23, 42, 0.4)), url('https://images.unsplash.com/photo-1500937386664-56d1dfef3854?q=80&w=2000&auto=format&fit=crop');">
        <p>Vos terres en un coup d'œil,</p>
        <h1>Gestion des Parcelles</h1>
    </header>

    <main class="main-content">
        <div class="card" style="padding:24px; margin-bottom:32px; display:flex; gap:15px; align-items:center; margin-top:-40px; flex-wrap:wrap;">
            <div style="flex:1; min-width:200px;">
                <input type="text" id="searchInput" placeholder="Chercher une parcelle par nom ou culture…"
                    oninput="filterParcelles()"
                    style="width:100%; padding:12px 15px; border:1.5px solid var(--border); border-radius:var(--radius-sm); font-size:14px; font-family:inherit; box-sizing:border-box;">
            </div>
            <button class="btn-primary" onclick="openModal()" id="btnAjouter">+ Ajouter une parcelle</button>
        </div>

        <!-- Compteur -->
        <div style="font-size:13px; font-weight:700; color:var(--text-muted); margin-bottom:20px; text-transform:uppercase;" id="compteur">
            Chargement…
        </div>

        <div class="stats-grid" id="parcellesGrid">
            <p style="color:var(--text-muted);">Chargement des parcelles…</p>
        </div>
    </main>

    <!-- Modal ajout parcelle -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
        <div class="modal" style="max-width:450px;">
            <h2 class="logo-text" style="color:var(--text-main); margin-bottom:25px; font-size:24px;">Nouvelle parcelle</h2>
            <div style="display:flex; flex-direction:column; gap:15px;">
                <input type="text" id="newNom" placeholder="Nom de la parcelle (ex: Le Clos)"
                    style="padding:12px; border:1.5px solid var(--border); border-radius:8px; font-family:inherit; font-size:14px;">
                <input type="text" id="newLocalisation" placeholder="Localisation (ex: Zone A)"
                    style="padding:12px; border:1.5px solid var(--border); border-radius:8px; font-family:inherit; font-size:14px;">
                <input type="number" id="newSurface" placeholder="Surface en hectares" step="0.01" min="0"
                    style="padding:12px; border:1.5px solid var(--border); border-radius:8px; font-family:inherit; font-size:14px;">
                <div id="modalMsg" style="font-size:13px; font-weight:600; display:none; padding:10px; border-radius:8px;"></div>
                <div style="display:flex; justify-content:flex-end; gap:15px; margin-top:10px;">
                    <button class="nav-link" style="color:var(--text-muted); padding:0; background:none; border:none; cursor:pointer;" onclick="closeModal()">Annuler</button>
                    <button class="btn-primary" onclick="ajouterParcelle()" style="padding:10px 25px;">Ajouter</button>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>
        const CULTURE_IMAGES = {
            'Blé': 'https://images.unsplash.com/photo-1574323347407-f5e1ad6d020b?q=80&w=800&auto=format&fit=crop',
            'Maïs': 'https://images.unsplash.com/photo-1551739440-5dd934d3a94a?q=80&w=800&auto=format&fit=crop',
            'Colza': 'https://images.unsplash.com/photo-1470137237906-d8a4f71e1966?q=80&w=800&auto=format&fit=crop',
            'Orge': 'https://images.unsplash.com/photo-1560472355-536de3962603?q=80&w=800&auto=format&fit=crop',
            'Tournesol': 'https://images.unsplash.com/photo-1597848212624-a19eb35e2651?q=80&w=800&auto=format&fit=crop',
        };
        const DEFAULT_IMG = 'https://images.unsplash.com/photo-1500937386664-56d1dfef3854?q=80&w=800&auto=format&fit=crop';

        let toutesLesParcelles = [];

        async function loadParcelles() {
            try {
                const res = await fetch('/api/parcelles');
                toutesLesParcelles = await res.json();
                renderParcelles(toutesLesParcelles);
            } catch(e) {
                document.getElementById('parcellesGrid').innerHTML =
                    '<p style="color:#ef4444;">⚠️ Impossible de contacter le serveur.</p>';
            }
        }

        function renderParcelles(liste) {
            const grid = document.getElementById('parcellesGrid');
            document.getElementById('compteur').textContent = liste.length + ' parcelle(s) trouvée(s)';
            if (liste.length === 0) {
                grid.innerHTML = '<p style="color:var(--text-muted);">Aucune parcelle trouvée.</p>';
                return;
            }
            grid.innerHTML = liste.map(p => {
                const img = CULTURE_IMAGES[p.culture] || DEFAULT_IMG;
                return `
                <div class="stat-card parcelle-card" data-culture="${p.culture || ''}" data-nom="${p.nom.toLowerCase()}"
                    style="padding:0; overflow:hidden;">
                    <div style="height:120px; background:url('${img}') center center; background-size:cover;"></div>
                    <div style="padding:20px;">
                        <div class="stat-label">${p.nom}</div>
                        <div style="font-size:18px; font-weight:700; margin:6px 0;">${p.culture || 'Culture non définie'}</div>
                        <div style="font-size:13px; color:var(--text-muted); display:flex; justify-content:space-between; align-items:center;">
                            <span>📍 ${p.localisation || '—'} · <strong>${p.surface_ha} ha</strong></span>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        function filterParcelles() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const filtered = toutesLesParcelles.filter(p =>
                p.nom.toLowerCase().includes(search) ||
                (p.culture || '').toLowerCase().includes(search) ||
                (p.localisation || '').toLowerCase().includes(search)
            );
            renderParcelles(filtered);
        }

        async function ajouterParcelle() {
            const nom = document.getElementById('newNom').value.trim();
            const localisation = document.getElementById('newLocalisation').value.trim();
            const surface_ha = parseFloat(document.getElementById('newSurface').value) || 0;
            const msg = document.getElementById('modalMsg');

            if (!nom) {
                msg.style.display = 'block';
                msg.style.background = '#fee2e2';
                msg.style.color = '#991b1b';
                msg.textContent = '⚠️ Le nom de la parcelle est obligatoire.';
                return;
            }

            try {
                const res = await fetch('/api/parcelles', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nom, localisation, surface_ha })
                });
                const data = await res.json();
                if (res.ok) {
                    msg.style.display = 'block';
                    msg.style.background = '#d1fae5';
                    msg.style.color = '#065f46';
                    msg.textContent = '✅ Parcelle ajoutée !';
                    document.getElementById('newNom').value = '';
                    document.getElementById('newLocalisation').value = '';
                    document.getElementById('newSurface').value = '';
                    setTimeout(() => { closeModal(); msg.style.display = 'none'; loadParcelles(); }, 1000);
                } else {
                    msg.style.display = 'block';
                    msg.style.background = '#fee2e2';
                    msg.style.color = '#991b1b';
                    msg.textContent = '❌ ' + (data.erreur || 'Erreur serveur');
                }
            } catch(e) {
                msg.style.display = 'block';
                msg.style.background = '#fee2e2';
                msg.style.color = '#991b1b';
                msg.textContent = '⚠️ Serveur inaccessible.';
            }
        }

        // Récupère infos utilisateur
        const user = JSON.parse(localStorage.getItem('user') || 'null');
        if (user && user.nom) {
            const initials = user.nom.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
            document.getElementById('userAvatar').textContent = initials;
            document.getElementById('userName').textContent = user.nom;
        }

        loadParcelles();
    </script>
</body>
</html>
