<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AgriTech – Gestion de vos parcelles agricoles.">
    <title>AgriTech – Parcelles</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <nav class="navbar">
        <div class="nav-brand">
            <button class="menu-toggle" id="openMenu">☰</button>
            <div class="logo-icon">🚜</div>
            <span class="logo-text">Agri<span>Tech</span></span>
        </div>
        <div class="nav-menu" id="mobileMenu">
            <button class="menu-close" id="closeMenu">✕</button>
            <a href="/home" class="nav-link">Tableau de bord</a>
            <a href="/parcelles" class="nav-link active">Parcelles</a>
            <a href="/observations" class="nav-link">Observations</a>
            <a href="/alertes" class="nav-link">Alertes</a>
            <a href="/meteo" class="nav-link">Météo</a>
            <a href="/carte" class="nav-link">Carte</a>
        </div>
        <div class="topbar-right">
            <div class="user-card">
                <div class="user-avatar" id="userAvatar">CL</div>
                <span class="user-name" id="userName">Clyfton</span>
            </div>
        </div>
    </nav>

    <header class="hero" style="background-image: linear-gradient(rgba(15, 23, 42, 0.4), rgba(15, 23, 42, 0.4)), url('https://images.unsplash.com/photo-1500937386664-56d1dfef3854?q=80&w=2000&auto=format&fit=crop');">
        <p>Vos terres en un coup d'œil,</p>
        <h1>Gestion des Parcelles</h1>
    </header>

    <main class="main-content">
        <div class="card parcelles-toolbar">
            <div class="parcelles-toolbar-search">
                <input type="text" id="searchInput" class="form-input" placeholder="Chercher une parcelle par nom ou culture…"
                    oninput="filterParcelles()">
            </div>
            <button class="btn-primary" onclick="openModal()" id="btnAjouter">+ Ajouter une parcelle</button>
        </div>

        <!-- Compteur -->
        <div class="parcelles-counter" id="compteur">
            Chargement…
        </div>

        <div class="stats-grid" id="parcellesGrid">
            <p class="text-muted">Chargement des parcelles…</p>
        </div>
    </main>

    <!-- Modal ajout parcelle -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
        <div class="modal">
            <h2 class="modal-title">Nouvelle parcelle</h2>
            <div class="modal-form">
                <input type="number" id="newNumero" class="form-input form-input-sm" placeholder="Numéro de la parcelle (ex: 14)" min="1">
                <input type="text" id="newLocalisation" class="form-input form-input-sm" placeholder="Localisation (ex: Zone A)">
                <input type="number" id="newSurface" class="form-input form-input-sm" placeholder="Surface en hectares" step="0.01" min="0">
                <select id="newCulture" class="form-select form-input-sm">
                    <option value="">Choisir une culture (optionnel)…</option>
                    <option value="Blé">🌾 Blé</option>
                    <option value="Maïs">🌽 Maïs</option>
                    <option value="Orge">🌿 Orge</option>
                    <option value="Colza">🌼 Colza</option>
                    <option value="Tournesol">🌻 Tournesol</option>
                </select>
                <div id="modalMsg" class="form-msg"></div>
                <div class="form-actions">
                    <button class="btn-link-cancel" onclick="closeModal()">Annuler</button>
                    <button class="btn-primary" onclick="ajouterParcelle()">Ajouter</button>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>
        const CULTURE_IMAGES = {
            'Blé': 'https://images.unsplash.com/photo-1529511582893-2d7e684dd128?q=80&w=1333&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D',
            'Maïs': 'https://images.unsplash.com/photo-1649251037465-72c9d378acb6?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D',
            'Colza': 'https://images.unsplash.com/photo-1625246333195-78d9c38ad449?q=80&w=800&auto=format&fit=crop',
            'Orge': 'https://images.unsplash.com/photo-1645439164506-84b9c8f53c96?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D',
            'Tournesol': 'https://images.unsplash.com/photo-1597848212624-a19eb35e2651?q=80&w=800&auto=format&fit=crop',
        };
        const DEFAULT_IMG = 'https://images.unsplash.com/photo-1500937386664-56d1dfef3854?q=80&w=800&auto=format&fit=crop';

        let toutesLesParcelles = [];

        async function loadParcelles() {
            try {
                const res = await fetch('/api/parcelles');
                toutesLesParcelles = await res.json();
                renderParcelles(toutesLesParcelles);
            } catch(e) {
                document.getElementById('parcellesGrid').innerHTML =
                    '<p style="color:#ef4444;">⚠️ Impossible de contacter le serveur.</p>';
            }
        }

        function renderParcelles(liste) {
            const grid = document.getElementById('parcellesGrid');
            document.getElementById('compteur').textContent = liste.length + ' parcelle(s) trouvée(s)';
            if (liste.length === 0) {
                grid.innerHTML = '<p class="text-muted">Aucune parcelle trouvée.</p>';
                return;
            }
            grid.innerHTML = liste.map(p => {
                const img = CULTURE_IMAGES[p.culture] || DEFAULT_IMG;
                return `
                <div class="stat-card parcelle-card" data-culture="${p.culture || ''}" data-nom="${p.nom.toLowerCase()}">
                    <div class="parcelle-card-image" style="background-image:url('${img}');"></div>
                    <div class="parcelle-card-body">
                        <div class="stat-label">${p.nom}</div>
                        <div class="parcelle-card-title">${p.culture || 'Culture non définie'}</div>
                        <div class="parcelle-card-info">
                            <span>📍 ${p.localisation || '—'} · <strong>${p.surface_ha} ha</strong></span>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        function filterParcelles() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const filtered = toutesLesParcelles.filter(p =>
                p.nom.toLowerCase().includes(search) ||
                (p.culture || '').toLowerCase().includes(search) ||
                (p.localisation || '').toLowerCase().includes(search)
            );
            renderParcelles(filtered);
        }

        async function ajouterParcelle() {
            const numero = document.getElementById('newNumero').value.trim();
            const localisation = document.getElementById('newLocalisation').value.trim();
            const surface_ha = parseFloat(document.getElementById('newSurface').value) || 0;
            const culture = document.getElementById('newCulture').value;
            const msg = document.getElementById('modalMsg');

            if (!numero) {
                msg.className = 'form-msg error';
                msg.textContent = '⚠️ Le numéro de la parcelle est obligatoire.';
                return;
            }

            const nom = 'Parcelle ' + numero;

            try {
                const res = await fetch('/api/parcelles', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nom, localisation, surface_ha, culture })
                });
                const data = await res.json();
                if (res.ok) {
                    msg.className = 'form-msg success';
                    msg.textContent = '✅ Parcelle ajoutée !';
                    document.getElementById('newNumero').value = '';
                    document.getElementById('newLocalisation').value = '';
                    document.getElementById('newSurface').value = '';
                    document.getElementById('newCulture').value = '';
                    setTimeout(() => { closeModal(); msg.className = 'form-msg'; loadParcelles(); }, 1000);
                } else {
                    msg.className = 'form-msg error';
                    msg.textContent = '❌ ' + (data.erreur || 'Erreur serveur');
                }
            } catch(e) {
                msg.className = 'form-msg error';
                msg.textContent = '⚠️ Serveur inaccessible.';
            }
        }

        // Récupère infos utilisateur
        const user = JSON.parse(localStorage.getItem('user') || 'null');
        if (user && user.nom) {
            const initials = user.nom.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
            document.getElementById('userAvatar').textContent = initials;
            document.getElementById('userName').textContent = user.nom;
        }

        loadParcelles();
    </script>
</body>
</html>
