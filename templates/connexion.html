<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AgriTech - Connexion à votre espace agricole.">
    <title>Connexion - AgriTech</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">

<div class="login-card">
    <div class="login-header">
        <div class="login-logo">🌾</div>
        <h1 class="login-title">AgriTech</h1>
        <p class="login-subtitle">Accédez à votre portail agricole</p>
    </div>

    <form id="loginForm" class="login-form">
        <div class="form-field">
            <label class="form-label">Email</label>
            <input type="email" id="email" class="form-input" placeholder="test@agritech.fr" required>
        </div>
        <div class="form-field">
            <label class="form-label">Mot de passe</label>
            <div class="password-wrapper">
                <input type="password" id="password" class="form-input" placeholder="password123" required>
                <button type="button" class="password-toggle" id="togglePassword" title="Afficher / masquer le mot de passe">
                    👁️
                </button>
            </div>
        </div>

        <button type="submit" class="btn-primary" id="submitBtn">
            Se connecter
        </button>
    </form>

    <div id="message" class="alert-message"></div>

    <div class="login-help">
        <strong>Compte de test :</strong><br>
        Email : test@agritech.fr<br>
        Mot de passe : password123
    </div>
</div>

<script>
    const loginForm = document.getElementById('loginForm');
    const messageDiv = document.getElementById('message');
    const submitBtn = document.getElementById('submitBtn');
    const passwordInput = document.getElementById('password');
    const togglePassword = document.getElementById('togglePassword');

    // Affiche / masque le mot de passe quand on clique sur l'œil
    togglePassword.addEventListener('click', () => {
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            togglePassword.textContent = '🙈';
        } else {
            passwordInput.type = 'password';
            togglePassword.textContent = '👁️';
        }
    });

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        submitBtn.textContent = 'Connexion…';
        submitBtn.disabled = true;

        const email = document.getElementById('email').value;
        const password = passwordInput.value;

        try {
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            if (response.ok) {
                localStorage.setItem('user', JSON.stringify(data.user));
                messageDiv.className = 'alert-message success';
                messageDiv.textContent = '✅ Connexion réussie ! Redirection…';
                setTimeout(() => { window.location.href = '/home'; }, 600);
            } else {
                messageDiv.className = 'alert-message error';
                messageDiv.textContent = '❌ ' + (data.erreur || 'Erreur de connexion');
                submitBtn.textContent = 'Se connecter';
                submitBtn.disabled = false;
            }
        } catch (error) {
            messageDiv.className = 'alert-message error';
            messageDiv.textContent = '⚠️ Le serveur est inaccessible. Lancez app.py.';
            submitBtn.textContent = 'Se connecter';
            submitBtn.disabled = false;
        }
    });
</script>

</body>
</html>
