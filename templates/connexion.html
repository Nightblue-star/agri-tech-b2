<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - AgriTech</title>
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>

<div class="login-card">
    <h2>AgriTech Login</h2>
    <form id="loginForm">
        <input type="email" id="email" placeholder="Email (test@agritech.fr)" required>
        <input type="password" id="password" placeholder="Mot de passe (password123)" required>
        <button type="submit">Se connecter</button>
    </form>
    <div id="message"></div>
</div>

<script>
    const loginForm = document.getElementById('loginForm');
    const messageDiv = document.getElementById('message');

    // on empeche la page de s'actualiser a chaque fois qu'on click sur connexion
    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        try {
            const response = await fetch('http://127.0.0.1:5000/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            if (response.ok) {
                
                localStorage.setItem('user', JSON.stringify(data.user));
                alert("Connexion réussie ! Bienvenue " + data.user.nom);
                
            } else {
                messageDiv.innerText = data.erreur || "Erreur de connexion";
            }
        } catch (error) {
            messageDiv.innerText = "Le serveur est éteint ou inaccessible.";
            console.error("Erreur fetch:", error);
        }
    });
</script>

</body>
</html>
