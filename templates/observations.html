<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AgriTech – Observations terrain de vos cultures.">
    <title>AgriTech – Observations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <nav class="navbar">
        <div class="nav-brand">
            <div class="logo-icon">🌿</div>
            <span class="logo-text">Agri<span>Tech</span></span>
        </div>
        <div class="nav-menu">
            <a href="/home" class="nav-link">Tableau de bord</a>
            <a href="/parcelles" class="nav-link">Parcelles</a>
            <a href="/observations" class="nav-link active">Observations</a>
            <a href="/alertes" class="nav-link">Alertes</a>
            <a href="/meteo" class="nav-link">Météo</a>
            <a href="/carte" class="nav-link">Carte</a>
        </div>
        <div class="topbar-right">
            <div class="user-card">
                <div class="user-avatar" id="userAvatar">CL</div>
                <span class="user-name" id="userName">Clyfton</span>
            </div>
        </div>
    </nav>

    <header class="hero" style="background-image: linear-gradient(rgba(15, 23, 42, 0.4), rgba(15, 23, 42, 0.4)), url('https://images.unsplash.com/photo-1591857177580-dc82b9ac4e1e?q=80&w=2000&auto=format&fit=crop');">
        <p>Notes du terrain,</p>
        <h1>Observations Cultures</h1>
    </header>

    <main class="main-content">
        <div class="dashboard-grid">

            <!-- Liste des observations -->
            <div>
                <div class="obs-date-label" id="obsDateLabel">
                    Chargement…
                </div>
                <div id="observationsList">
                    <p class="text-muted">Chargement des observations…</p>
                </div>
            </div>

            <!-- Formulaire nouvelle observation -->
            <div class="card obs-form-card">
                <h3 class="card-title">Nouvelle observation</h3>
                <div class="obs-form-stack">

                    <div class="form-field">
                        <label class="form-label-uppercase">Parcelle</label>
                        <select id="obsParcelleId" class="form-select form-input-sm">
                            <option value="">Choisir une parcelle…</option>
                        </select>
                    </div>

                    <div class="form-field">
                        <label class="form-label-uppercase">État observé</label>
                        <select id="obsEtat" class="form-select form-input-sm">
                            <option value="">Sélectionner un état…</option>
                            <option value="OK">✅ OK</option>
                            <option value="Stress hydrique">💧 Stress hydrique</option>
                            <option value="Risque maladie">⚠️ Risque maladie</option>
                            <option value="Maladie détectée">🔴 Maladie détectée</option>
                        </select>
                    </div>

                    <div class="form-field">
                        <label class="form-label-uppercase">Commentaire</label>
                        <textarea id="obsCommentaire" class="form-textarea form-input-sm" placeholder="Que remarquez-vous sur le terrain ?"></textarea>
                    </div>

                    <div id="obsMsg" class="form-msg"></div>

                    <button class="btn-primary" onclick="enregistrerObservation()">
                        Enregistrer la note
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>
        const ETAT_CONFIG = {
            'OK':                { bg:'#d1fae5', color:'#065f46', icon:'✅' },
            'Stress hydrique':   { bg:'#e0f2fe', color:'#0369a1', icon:'💧' },
            'Risque maladie':    { bg:'#fef3c7', color:'#92400e', icon:'⚠️' },
            'Maladie détectée':  { bg:'#fee2e2', color:'#991b1b', icon:'🔴' },
        };

        // Charge la liste des parcelles dans le select du formulaire
        async function loadParcellesSelect() {
            try {
                const res = await fetch('/api/parcelles');
                const parcelles = await res.json();
                const sel = document.getElementById('obsParcelleId');
                parcelles.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p.id;
                    opt.textContent = p.nom + (p.culture ? ' · ' + p.culture : '');
                    sel.appendChild(opt);
                });
            } catch(e) { console.error('Erreur chargement parcelles:', e); }
        }

        // Charge et affiche les observations
        async function loadObservations() {
            try {
                const res = await fetch('/api/observations');
                const data = await res.json();

                const container = document.getElementById('observationsList');
                const label = document.getElementById('obsDateLabel');

                if (data.length === 0) {
                    label.textContent = 'Aucune observation enregistrée';
                    container.innerHTML = '<p class="text-muted">Pas encore d\'observations. Utilisez le formulaire →</p>';
                    return;
                }

                label.textContent = data.length + ' observation(s) enregistrée(s)';
                container.innerHTML = data.map(obs => {
                    const cfg = ETAT_CONFIG[obs.etat] || { bg:'#f1f5f9', color:'#64748b', icon:'📋' };
                    return `
                    <div class="card obs-card" style="border-left-color:${cfg.color};">
                        <div class="obs-card-header">
                            <span class="obs-pill" style="background:${cfg.bg}; color:${cfg.color};">
                                ${cfg.icon} ${obs.etat}
                            </span>
                            <div class="obs-card-actions">
                                <span class="obs-card-date">${obs.date}</span>
                                <button class="btn-delete" onclick="supprimerObservation(${obs.id})" title="Supprimer cette observation">
                                    🗑️
                                </button>
                            </div>
                        </div>
                        <div class="obs-card-title">
                            ${obs.parcelle_nom || 'Parcelle #' + obs.parcelle_id}
                        </div>
                        <p class="obs-card-comment">
                            ${obs.commentaire || '<em>Aucun commentaire</em>'}
                        </p>
                    </div>`;
                }).join('');
            } catch(e) {
                document.getElementById('observationsList').innerHTML =
                    '<p style="color:#ef4444;">⚠️ Impossible de contacter le serveur.</p>';
            }
        }

        // Supprime une observation après confirmation
        async function supprimerObservation(id) {
            if (!confirm('Êtes-vous sûr de vouloir supprimer cette observation ?')) return;
            try {
                const res = await fetch('/api/observations/' + id, { method: 'DELETE' });
                if (res.ok) {
                    loadObservations();
                } else {
                    alert('❌ Erreur lors de la suppression.');
                }
            } catch(e) {
                alert('⚠️ Serveur inaccessible.');
            }
        }

        async function enregistrerObservation() {
            const parcelle_id = document.getElementById('obsParcelleId').value;
            const etat = document.getElementById('obsEtat').value;
            const commentaire = document.getElementById('obsCommentaire').value.trim();
            const msg = document.getElementById('obsMsg');

            if (!parcelle_id || !etat) {
                msg.className = 'form-msg error';
                msg.textContent = '⚠️ Veuillez choisir une parcelle et un état.';
                return;
            }

            try {
                const res = await fetch('/api/observations', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ parcelle_id: parseInt(parcelle_id), etat, commentaire })
                });
                const data = await res.json();
                if (res.ok) {
                    msg.className = 'form-msg success';
                    msg.textContent = '✅ Observation enregistrée !';
                    document.getElementById('obsParcelleId').value = '';
                    document.getElementById('obsEtat').value = '';
                    document.getElementById('obsCommentaire').value = '';
                    setTimeout(() => { msg.className = 'form-msg'; loadObservations(); }, 1000);
                } else {
                    msg.className = 'form-msg error';
                    msg.textContent = '❌ ' + (data.erreur || 'Erreur serveur');
                }
            } catch(e) {
                msg.className = 'form-msg error';
                msg.textContent = '⚠️ Serveur inaccessible.';
            }
        }

        // Infos utilisateur
        const user = JSON.parse(localStorage.getItem('user') || 'null');
        if (user && user.nom) {
            const initials = user.nom.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
            document.getElementById('userAvatar').textContent = initials;
            document.getElementById('userName').textContent = user.nom;
        }

        loadParcellesSelect();
        loadObservations();
    </script>
</body>
</html>
